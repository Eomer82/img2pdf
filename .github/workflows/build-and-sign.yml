name: Build and Sign Img2Pdf

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  release:
    types: [published] # Triggers automatically when a new GitHub Release is published

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      contents: write # Required to upload assets to GitHub Release

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 1. Build Windows x64 self-contained executable
      - name: Build self-contained application
        shell: pwsh
        run: |
          dotnet publish src/Img2Pdf.App/Img2Pdf.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o ./build-output

      # 2. Upload unsigned binary as temporary artifact
      - name: Upload unsigned binary to GitHub Artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-img2pdf
          path: ./build-output/Img2Pdf.exe

      # 3. Submit to SignPath for official code signing (executes once SignPath secrets are configured)
      - name: Sign executable via SignPath
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        if: env.SIGNPATH_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'img2pdf'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-output'

      # 4. Prepare release asset (uses signed file if available, otherwise unsigned)
      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./release-asset"
          if (Test-Path "./signed-output/Img2Pdf.exe") {
            Write-Host "Using signed executable from SignPath"
            Copy-Item "./signed-output/Img2Pdf.exe" "./release-asset/Img2Pdf.exe" -Force
          } else {
            Write-Host "SignPath not configured yet - using newly built executable"
            Copy-Item "./build-output/Img2Pdf.exe" "./release-asset/Img2Pdf.exe" -Force
          }

      # 5. Publish to GitHub Release (when triggered by release event)
      - name: Publish Img2Pdf.exe to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-asset/Img2Pdf.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Upload executable as downloadable artifact on manual runs
      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Img2Pdf-Windows-x64
          path: ./release-asset/Img2Pdf.exe
